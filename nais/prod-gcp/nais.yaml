apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: personopplysninger
  namespace: min-side
  labels:
    team: min-side
spec:
  image: {{ image }}
  port: 3000
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  idporten:
    enabled: true
    sidecar:
      enabled: true
      autoLogin: false
      level: Level4
  tokenx:
    enabled: true
  liveness:
    path: /person/personopplysninger/api/internal/isAlive
    initialDelay: 10
  readiness:
    path: /person/personopplysninger/api/internal/isReady
    initialDelay: 10
  replicas:
    min: 2
    max: 4
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: "200m"
      memory: 256Mi
  accessPolicy:
    outbound:
      rules:
        - application: nav-dekoratoren
          namespace: personbruker
        - application: tms-personopplysninger-api
      external:
        - host: www.nav.no
        - host: nav.no
  ingresses:
    - "https://www.nav.no/person/personopplysninger"
    - "https://www.intern.nav.no/person/personopplysninger"
  env:
    - name: API_PATH
      value: "/tms-personopplysninger-api"
    - name: APP_ORIGIN
      value: "https://www.nav.no"
    - name: BUILD_VERSION
      value: "{{ version }}"
    - name: DINE_SAKER_URL
      value: "https://www.nav.no/dokumentarkiv"
    - name: DITT_NAV_URL
      value: "https://www.nav.no/minside"
    - name: ENDRE_KONTONUMMER_URL
      value: "https://www.nav.no/tms-endre-kontonummer"
    - name: LOGIN_URL
      value: "https://login.nav.no/oauth2/login"
    - name: PDL_URL
      value: "https://www.nav.no/person/pdl-fullmakt-ui"
    - name: PERSONOPPLYSNINGER_API_URL
      value: "http://tms-personopplysninger-api/tms-personopplysninger-api"
    - name: SKJERMING_URL
      value: "https://www.nav.no/person/personopplysninger/skjerming"
    - name: SYKEFRAVAER_URL
      value: "https://www.nav.no/syk/sykefravaer"
    - name: TELEMETRY_URL
      value: "https://telemetry.nav.no/collect"
    - name: UTBETALINGSOVERSIKT_URL
      value: "https://tjenester.nav.no/utbetalingsoversikt"
